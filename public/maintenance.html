<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>We'll be back soon | Home-Office Apartments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" />
  <style>
    :root {
      --green: #1f4d38;
      --green-2: #2d6a4f;
      --ink: #1f2b26;
      --cream: #f4f2ec;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: 'Poppins', system-ui, sans-serif;
      color: #fff;
      background: var(--green);
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      position: relative;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      overflow: hidden;
    }
    /* The house in the background, dimmed under the green */
    .bg {
      position: absolute;
      inset: 0;
      background: url('/images/hero-property-1600.webp') center / cover no-repeat;
      opacity: .18;
      filter: grayscale(.3);
    }
    .card {
      position: relative;
      max-width: 560px;
      text-align: center;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
      color: #fff;
      text-align: left;
    }
    .logo img { width: 56px; height: auto; display: block; }
    .logo strong { display: block; font-size: 18px; font-weight: 600; line-height: 1.2; }
    .logo span { display: block; font-family: 'Space Grotesk', sans-serif; font-size: 13px; color: rgba(255,255,255,.75); }
    .label {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(255,255,255,.8);
    }
    .label::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f5a623;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .3; } }
    h1 {
      margin: 16px 0 16px;
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -.03em;
    }
    p {
      margin: 0 auto;
      max-width: 460px;
      font-size: 18px;
      line-height: 1.6;
      color: rgba(255,255,255,.85);
    }
    .contact {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 36px;
    }
    .contact a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 22px;
      border-radius: 999px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15.5px;
      font-weight: 500;
      text-decoration: none;
      color: #fff;
      border: 1px solid rgba(255,255,255,.35);
    }
    .contact a.primary { background: #fff; color: var(--green); border-color: #fff; }
    .contact svg { width: 16px; height: 16px; }
    .foot {
      margin-top: 48px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      color: rgba(255,255,255,.6);
    }
    @media (prefers-reduced-motion: reduce) { .label::before { animation: none; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="bg" aria-hidden="true"></div>
    <div class="card">
      <div class="logo">
        <img src="/images/logo-icon.png" alt="" />
        <div>
          <strong>Home-Office Apartments</strong>
          <span>and LivingSpring Gardens</span>
        </div>
      </div>

      <div class="label">Under maintenance</div>
      <h1>We'll be back soon.</h1>
      <p>
        We're making some improvements to the website. To book a stay or ask a question
        in the meantime, call or email us — we're happy to help.
      </p>

      <div class="contact">
        <a class="primary" href="tel:+233206301032">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          +233 20 630 1032
        </a>
        <a href="mailto:jamesd@home-officegroup.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          jamesd@home-officegroup.com
        </a>
      </div>

      <div class="foot">Fiapre, Sunyani · Ghana</div>
    </div>
  </main>
</body>
</html>
